app:
  home: ${user.home}/.ielts-app
  open-browser: true
  content:
    bootstrap: true
  session:
    max-reviews: 60
    new-words: 10
    skip-new-when-due-over: 100
  backup:
    keep: 7
    schedule-enabled: true

server:
  address: 127.0.0.1
  port: 8765
  servlet:
    session:
      timeout: 8h

spring:
  application:
    name: ielts-app
  datasource:
    url: jdbc:sqlite:${app.home}/ielts.db?journal_mode=WAL&foreign_keys=on&busy_timeout=5000
    hikari:
      maximum-pool-size: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

logging:
  file:
    name: ${app.home}/logs/app.log
  logback:
    rollingpolicy:
      max-history: 14
      max-file-size: 10MB
